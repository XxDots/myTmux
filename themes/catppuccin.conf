## Current Configuration

The myTmux configuration uses these Catppuccin settings:

```tmux
# --- Catppuccin Theme Configuration ---
set -g @catppuccin_flavor 'mocha'

# Window separators
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"

# Window positioning and text
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Status bar modules
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Directory text
set -g @catppuccin_directory_text "#{pane_current_path}"
```

---

## Available Flavors

Catppuccin provides multiple color schemes. You can switch by changing:

```tmux
set -g @catppuccin_flavor 'mocha'  # Current: Dark with purple/blue accents
set -g @catppuccin_flavor 'macchiato'  # Dark with softer colors
set -g @catppuccin_flavor 'frappe'     # Dark with different accent
set -g @catppuccin_flavor 'latte'      # Light theme
```

---

## Customization Examples

### Change Window Separator
```tmux
# Use different separators
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_middle_separator "│"

# Or use default
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
```

### Customize Status Modules
```tmux
# Show different info on right side
set -g @catppuccin_status_modules_right "date_time session"
set -g @catppuccin_status_modules_right "cpu ram session"
set -g @catppuccin_status_modules_right "directory"
```

### Change Status Bar Style
```tmux
# Use powerline style
set -g @catppuccin_status_fill "powerline"

# Use icon style (current)
set -g @catppuccin_status_fill "icon"

# Use simple background
set -g @catppuccin_status_fill "all"
```

---

## Available Status Modules

The following modules can be added to status bar:

| Module | Description |
| :--- | :--- |
| `application` | Current application name |
| `host` | Hostname |
| `date_time` | Current date and time |
| `session` | Current session name |
| `directory` | Current directory path |
| `cpu` | CPU usage (if available) |
| `ram` | RAM usage (if available) |

### Example: Multiple Modules
```tmux
set -g @catppuccin_status_modules_left "session user host"
set -g @catppuccin_status_modules_right "directory cpu ram date_time"
```

---

## Text Formatting Variables

You can customize what text shows in different places:

```tmux
# Window text
set -g @catppuccin_window_default_text "#W"  # Window name
set -g @catppuccin_window_default_text "#I"  # Window index

# Directory text
set -g @catppuccin_directory_text "#{pane_current_path}"  # Full path
set -g @catppuccin_directory_text "#{b:pane_current_path}"  # Basename only

# Session text
set -g @catppuccin_session_text "#S"  # Session name
```

---

## Tmux Variables Reference

Common variables you can use:

| Variable | Description |
| :--- | :--- |
| `#W` | Window name |
| `#I` | Window index |
| `#S` | Session name |
| `#P` | Pane index |
| `#{pane_current_path}` | Current pane path |
| `#{b:pane_current_path}` | Basename of current path |
| `#{host_short}` | Hostname (short) |
| `#{host}` | Hostname (full) |
| `#{username}` | Current user |
| `#{session_width}` | Session width |
| `#{session_height}` | Session height |

