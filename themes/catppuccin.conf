## Switching Themes At Runtime

You can test different themes without reloading:

```bash
# Test macchiato theme
tmux set -g @catppuccin_flavor 'macchiato'
tmux run '~/.tmux/plugins/tpm/tpm'

# Reload to apply
tmux source ~/.tmux.conf
```

