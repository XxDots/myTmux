## Troubleshooting

### Theme Not Applying
1. Make sure TPM is installed
2. Run: `tmux source ~/.tmux.conf`
3. Re-install plugins: `Alt + a`, then `I`

### Colors Look Wrong
1. Check terminal color support: `echo $TERM`
2. Ensure your terminal supports 256 colors or true color
3. Add to your shell config:
   ```bash
   export TERM=xterm-256color
   ```

### Need Specific Color?
- Refer to color palette table above
- Create custom theme by modifying color hex values
- Use hex colors in custom tmux variables

