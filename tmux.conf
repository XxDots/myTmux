# -----------------------------------------------------------------------------
# Repository:  XxDots/myTmux
# Description: myTmux - Ergonomic tmux configuration inspired by modern IDEs
# Inspired by: folke/LazyVim
# -----------------------------------------------------------------------------

# ==========================================
#        KONTROL UTAMA (PREFIX)
# ==========================================
set -g prefix M-a
unbind C-a
bind M-a send-prefix

# Menu Which-Key otomatis muncul saat tekan Alt + a
bind-key M-a run-shell "/home/oreo/myTmux/which-key.sh"

# Reload config: Alt + a lalu r
bind r source-file ~/.tmux.conf \; display-message "✅ Config Reloaded Successfully! ✅"

# ==========================================
#       TAMPILAN (AESTHETICS)
# ==========================================
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position bottom
set -g mouse on
set -g history-limit 1000000
set -s escape-time 0

# ==========================================
#    NAVIGASI "LAZY" (TANPA PREFIX)
# ==========================================
# 1. Pindah antar jendela (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 2. Ubah ukuran jendela (Langsung pake Ctrl + Panah - Sesuai Request)
bind -n C-Up resize-pane -U 1
bind -n C-Down resize-pane -D 1
bind -n C-Left resize-pane -L 1
bind -n C-Right resize-pane -R 1

unbind Up
unbind Down
unbind Left
unbind Right

# 3. Terminal Melayang (Alt + i)
bind -n M-i display-popup -b rounded -d "#{pane_current_path}" -w 80% -h 80% -E "zsh"

# 4. Pindah Tab cepat (Alt + angka)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# 5. Lihat semua bantuan (Alt + /)
bind-key -n M-/ run-shell "/home/oreo/myTmux/which-key.sh"

# ==========================================
#      FITUR VIM (COPY MODE)
# ==========================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==========================================
#          PLUGINS (TPM)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'

# --- Konfigurasi Tema Catppuccin ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# Inisialisasi Plugin Manager
run '~/.tmux/plugins/tpm/tpm'
